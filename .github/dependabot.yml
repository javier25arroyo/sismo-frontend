version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns:
          - "@angular/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      lucide:
        patterns:
          - "@lucide/*"
    ignore:
      - dependency-name: "typescript"
        versions: ["6.x"]
      - dependency-name: "@types/node"
        versions: ["25.x"]
