# ── Upstream SSR ────────────────────────────────────────────────────────────
upstream ssr {
    server frontend:4000;
    keepalive 16;
}

# Upstream del backend — resuelto por el DNS interno de Docker (127.0.0.11).
# keepalive 32 reutiliza conexiones hacia Spring Boot evitando el handshake TCP por cada petición.
upstream backend {
    server app:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Cabeceras de seguridad
    # NOTA: CSP se omite intencionalmente — autoCsp de Angular (angular.json)
    # genera una meta tag CSP basada en nonce en tiempo de build. Agregar
    # una cabecera CSP aquí causaría conflicto y debilitaría esa protección.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Proxy inverso para la API ────────────────────────────────────────────────
    # Todas las peticiones /api/** se reenvían al contenedor backend Spring Boot.
    # El navegador llama al mismo origen (nginx), por lo que no se necesitan cabeceras CORS.
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    # Actuator (health, prometheus, info) — solo acceso interno
    location /actuator/ {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Todo lo demás → Node.js SSR ─────────────────────────────────────────────
    location / {
        proxy_pass http://ssr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Bloquear acceso a archivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
