<div
  class="fixed inset-0 z-[1000] flex items-center justify-center px-4"
  *ngIf="visible()"
>
  <button
    type="button"
    class="absolute inset-0 bg-slate-950/55 backdrop-blur-sm"
    aria-label="Cerrar confirmación"
    (click)="onCancel()"
  ></button>
  <div
    class="relative w-full max-w-md rounded-lg border border-slate-200 bg-white p-6 shadow-2xl"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="confirm-title"
    aria-describedby="confirm-message"
  >
    <h2 id="confirm-title" class="text-xl font-semibold text-slate-900">{{ title() }}</h2>
    <p id="confirm-message" class="mt-3 text-sm leading-6 text-slate-600">{{ message() }}</p>
    <div class="mt-6 flex justify-end gap-3">
      <button
        type="button"
        class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 transition-colors hover:border-slate-400 hover:bg-slate-50"
        (click)="onCancel()"
      >
        {{ cancelText() }}
      </button>
      <button
        type="button"
        class="rounded-lg bg-rose-600 px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-rose-700"
        (click)="onConfirm()"
      >
        {{ confirmButtonText() }}
      </button>
    </div>
  </div>
</div>
