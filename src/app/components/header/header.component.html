<header class="sticky top-0 z-50 border-b border-slate-800 bg-slate-950">
  <nav class="mx-auto flex w-full max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8">

    <!-- BRAND -->
    <a routerLink="/"
      class="flex items-center gap-2 text-base font-bold tracking-widest text-white transition hover:text-sky-400">
      <i-lucide [img]="brandIcon" size="16" class="text-sky-400"></i-lucide>
      <span>SISMOLOGÍA<span class="text-sky-400">.ICE</span></span>
    </a>

    <!-- NAV LINKS -->
    <ul class="flex items-center gap-1 text-xs font-semibold uppercase tracking-widest text-slate-400">
      <li>
        <a routerLink="/sismos"
          routerLinkActive="text-white bg-slate-800"
          class="rounded-lg px-3 py-2 transition hover:text-white hover:bg-slate-800/60">
          Sismos
        </a>
      </li>
      <li>
        <a routerLink="/historial"
          routerLinkActive="text-white bg-slate-800"
          class="rounded-lg px-3 py-2 transition hover:text-white hover:bg-slate-800/60">
          Historial
        </a>
      </li>
      <li>
        <a routerLink="/estaciones"
          routerLinkActive="text-white bg-slate-800"
          class="rounded-lg px-3 py-2 transition hover:text-white hover:bg-slate-800/60">
          Estaciones
        </a>
      </li>
      <li>
        <a routerLink="/repositorio"
          routerLinkActive="text-white bg-slate-800"
          class="rounded-lg px-3 py-2 transition hover:text-white hover:bg-slate-800/60">
          Repositorio
        </a>
      </li>
    </ul>

    <!-- AUTH -->
    <div class="flex items-center gap-3">
      <ng-container *ngIf="auth.isAuthenticated(); else loginLink">
        <a routerLink="/profile"
          class="flex items-center gap-2 rounded-xl border border-slate-700 bg-slate-900 px-3 py-1.5 transition hover:border-slate-600">
          <div class="flex h-7 w-7 items-center justify-center rounded-full bg-sky-600 text-xs font-bold text-white">
            {{ auth.getRole()?.charAt(0) ?? 'U' }}
          </div>
          <span class="text-xs font-medium text-slate-300">Admin Técnico</span>
        </a>
      </ng-container>
      <ng-template #loginLink>
        <a routerLink="/acceso"
          class="rounded-xl border border-slate-600 bg-slate-800 px-4 py-2 text-xs font-semibold uppercase tracking-wide text-white transition hover:bg-slate-700 hover:border-slate-500">
          Acceso Técnico
        </a>
      </ng-template>
    </div>

  </nav>
</header>
