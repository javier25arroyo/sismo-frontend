<header class="sticky top-0 z-50 bg-surface/90 backdrop-blur-md">
  <nav class="mx-auto flex w-full max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8">

    <!-- BRAND -->
    <a routerLink="/"
      class="flex items-center gap-2 text-headline-sm font-bold tracking-tight text-primary transition hover:text-primary-container">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-secondary" aria-hidden="true">
          <path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>
        </svg>
      <span>SISMOLOGÍA<span class="text-secondary">.ICE</span></span>
    </a>

    <!-- NAV LINKS -->
    <ul class="flex items-center gap-1 text-label-sm font-semibold uppercase tracking-wide text-text-primary">
      <li>
        <a routerLink="/sismos"
          routerLinkActive="bg-surface-container-highest text-secondary"
          class="rounded-lg px-3 py-2 transition hover:bg-surface-container-highest">
          Sismos
        </a>
      </li>
      <li>
        <a routerLink="/historial"
          routerLinkActive="bg-surface-container-highest text-secondary"
          class="rounded-lg px-3 py-2 transition hover:bg-surface-container-highest">
          Historial
        </a>
      </li>
      <li>
        <a routerLink="/estaciones"
          routerLinkActive="bg-surface-container-highest text-secondary"
          class="rounded-lg px-3 py-2 transition hover:bg-surface-container-highest">
          Estaciones
        </a>
      </li>
      <li>
        <a routerLink="/consultas"
          routerLinkActive="bg-surface-container-highest text-secondary"
          class="rounded-lg px-3 py-2 transition hover:bg-surface-container-highest">
          Consultas
        </a>
      </li>
      <li>
        <a routerLink="/repositorio"
          routerLinkActive="bg-surface-container-highest text-secondary"
          class="rounded-lg px-3 py-2 transition hover:bg-surface-container-highest">
          Reportes
        </a>
      </li>
    </ul>

    <!-- AUTH -->
    <div class="flex items-center gap-3">
      <ng-container *ngIf="auth.isAuthenticated(); else loginLink">
        <a routerLink="/profile"
          class="flex items-center gap-2 rounded-xl bg-surface-container-low px-3 py-1.5 transition hover:bg-surface-container-highest">
          <div class="flex h-7 w-7 items-center justify-center rounded-full bg-primary text-label-sm font-bold text-white">
            {{ auth.getRole()?.charAt(0) ?? 'U' }}
          </div>
          <span class="text-label-sm font-medium text-text-primary">Admin Técnico</span>
        </a>
      </ng-container>
      <ng-template #loginLink>
        <a routerLink="/acceso"
          class="rounded-xl gradient-cta px-4 py-2 text-label-sm font-semibold uppercase tracking-wide text-white transition hover:brightness-110">
          Acceso Técnico
        </a>
      </ng-template>
    </div>

  </nav>
</header>
