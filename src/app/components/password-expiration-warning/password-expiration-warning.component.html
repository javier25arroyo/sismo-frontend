@if (visible()) {
  <div
    role="alert"
    aria-live="polite"
    class="mx-auto mt-3 flex w-full max-w-7xl items-center justify-between gap-3 rounded-xl border px-4 py-3 shadow-sm sm:px-6 lg:px-8"
    [ngClass]="claseContenedor()">
    <div class="flex items-start gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="mt-0.5 shrink-0" aria-hidden="true">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
      <p class="text-sm font-medium">{{ mensaje() }}</p>
    </div>
    <div class="flex items-center gap-2">
      <a
        routerLink="/cambiar-contrasena"
        class="inline-flex items-center rounded-lg px-3 py-1.5 text-xs font-semibold uppercase tracking-wide text-white transition-colors"
        [ngClass]="claseBoton()">
        Cambiar contraseña
      </a>
      @if (!expirada()) {
        <button
          type="button"
          (click)="cerrar()"
          aria-label="Cerrar aviso"
          class="flex h-8 w-8 items-center justify-center rounded-lg text-current/70 transition hover:bg-black/5">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      }
    </div>
  </div>
}
