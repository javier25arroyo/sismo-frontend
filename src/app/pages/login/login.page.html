<div class="flex min-h-screen flex-col bg-slate-950">
  <!-- Main content -->
  <div class="flex flex-1 items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm">
      <!-- Card -->
      <div class="rounded-3xl bg-white px-8 py-10 shadow-2xl">
        <!-- Logo / header -->
        <div class="flex flex-col items-center text-center">
          <div class="flex h-16 w-16 items-center justify-center rounded-2xl bg-sky-600 shadow-lg">
            <svg class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"/>
            </svg>
          </div>
          <p class="mt-3 text-xs font-bold uppercase tracking-widest text-slate-400">ICE INSTITUCIONAL</p>
          <h1 class="mt-1 text-2xl font-bold tracking-tight text-slate-900">Acelerografía</h1>
          <p class="mt-2 text-sm font-semibold text-slate-700">Acceso Técnico</p>
          <p class="mt-1 text-xs text-slate-500">
            Sistemas de monitoreo y red de estaciones de visualización en tiempo real.
          </p>
        </div>

        <!-- Form -->
        <form class="mt-8 space-y-5" (submit)="onSubmit($event)">
          <!-- Username -->
          <div>
            <label class="mb-1.5 block text-xs font-bold uppercase tracking-widest text-slate-500">
              Identificación de usuario
            </label>
            <div class="relative">
              <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-slate-400">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
                </svg>
              </span>
              <input
                type="text"
                name="username"
                autocomplete="username"
                placeholder="nombre.apellido@ice.go.cr"
                required
                class="block w-full rounded-xl border border-slate-300 bg-white py-3 pl-10 pr-4 text-sm text-slate-900 outline-none transition placeholder:text-slate-300 focus:border-sky-500 focus:ring-2 focus:ring-sky-200"/>
            </div>
          </div>

          <!-- Password -->
          <div>
            <div class="mb-1.5 flex items-center justify-between">
              <label class="block text-xs font-bold uppercase tracking-widest text-slate-500">Contraseña</label>
              <a href="#" class="text-xs font-medium text-sky-600 hover:text-sky-700 transition">¿Recuperar acceso?</a>
            </div>
            <div class="relative">
              <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-slate-400">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
                </svg>
              </span>
              <input
                [type]="showPassword ? 'text' : 'password'"
                name="password"
                required
                class="block w-full rounded-xl border border-slate-300 bg-white py-3 pl-10 pr-10 text-sm text-slate-900 outline-none transition placeholder:text-slate-300 focus:border-sky-500 focus:ring-2 focus:ring-sky-200"/>
              <button
                type="button"
                (click)="showPassword = !showPassword"
                class="absolute inset-y-0 right-3 flex items-center text-slate-400 hover:text-slate-600 transition">
                <svg *ngIf="!showPassword" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                <svg *ngIf="showPassword" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Remember me -->
          <label class="flex cursor-pointer items-center gap-3">
            <input type="checkbox" name="remember"
              class="h-4 w-4 rounded border-slate-300 text-sky-600 focus:ring-sky-500"/>
            <span class="text-sm text-slate-600">Mantener sesión activa</span>
          </label>

          <!-- Error -->
          <div *ngIf="error" class="rounded-xl bg-rose-50 px-4 py-3 text-sm font-medium text-rose-700" aria-live="polite">
            {{ error }}
          </div>

          <!-- Submit -->
          <button
            type="submit"
            [disabled]="loading"
            class="flex w-full items-center justify-center gap-2 rounded-xl bg-sky-600 px-6 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2 disabled:opacity-60">
            <svg *ngIf="loading" class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <ng-container *ngIf="loading; else loginLabel">Verificando...</ng-container>
            <ng-template #loginLabel>
              <span class="inline-flex items-center gap-1">
                <span>Iniciar Sesión Técnica</span>
                <i-lucide [img]="arrowRightIcon" size="14" class="shrink-0"></i-lucide>
              </span>
            </ng-template>
          </button>

          <!-- SSL badge -->
          <div class="flex items-center justify-center gap-2 text-xs font-medium text-slate-400">
            <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>
            </svg>
            CONEXIÓN ENCRIPTADA SSL
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Minimal footer -->
  <footer class="border-t border-slate-800 py-4 px-6">
    <div class="mx-auto flex max-w-7xl items-center justify-between text-xs text-slate-500">
      <span class="font-semibold uppercase tracking-wider">ICE – Portal de Ingeniería</span>
      <nav class="flex gap-4">
        <a href="#" class="hover:text-slate-300 transition">Términos</a>
        <a href="#" class="hover:text-slate-300 transition">Soporte Técnico</a>
        <a href="#" class="hover:text-slate-300 transition">Transparencia</a>
      </nav>
    </div>
  </footer>
</div>
